[package]
name = "aurelius-lanes"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
integration-tests = []

[[test]]
name = "review_feed"
path = "tests/review_feed.rs"
required-features = ["integration-tests"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
futures = "0.3"
kreuzberg = { version = "=4.10.4", default-features = false, features = ["tokio-runtime", "html", "chunking"] }
object_store = { version = "0.14", features = ["aws"] }
pgvector = { version = "0.4", features = ["sqlx"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
swiftide-core = { version = "=0.32.1", default-features = false }
swiftide-indexing = { version = "=0.32.1", default-features = false }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
