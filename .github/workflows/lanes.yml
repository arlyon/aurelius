name: Indexing lanes
on:
  workflow_dispatch:
  pull_request:
    paths: ['lanes/**', '.github/workflows/lanes.yml']
  push:
    branches: [main]
    paths: ['lanes/**', '.github/workflows/lanes.yml']
permissions:
  contents: read
jobs:
  pg18-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: custom_adapter_db
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: lanes
    env:
      PG_ADAPTER_TEST_URL: postgres://postgres:postgres@localhost:5432/custom_adapter_db
      SOURCE_API_TEST_CLIENT_ID: fixture-client
      SOURCE_API_TEST_CLIENT_SECRET: fixture-value
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Temporal protocol compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lanes
      - run: cargo fmt --all -- --check
      - run: >-
          cargo clippy --locked --all-targets --features postgres,temporal
          -- -D warnings
      - run: cargo test --locked --features postgres
