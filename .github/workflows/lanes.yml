name: Indexing lanes
on:
  pull_request:
    paths: ['lanes/**', '.github/workflows/lanes.yml']
  push:
    branches: [main]
    paths: ['lanes/**', '.github/workflows/lanes.yml']
permissions:
  contents: read
jobs:
  pg18-review-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: lanes
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lanes
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features integration-tests -- -D warnings
      - run: cargo test --locked --features integration-tests
